<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdfbf7" />
    <title>Iris — Site shell preview</title>
    <link rel="stylesheet" href="./iris.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        min-height: 100%;
        background: var(--background);
      }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font-family: var(--font-sans);
        transition:
          background-color 160ms ease,
          color 160ms ease;
      }
      .preview-page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }
      .iris-header__actions {
        gap: 0.25rem;
      }
      .iris-header__action {
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .iris-header__action svg {
        width: 1.2rem;
        height: 1.2rem;
      }
      .iris-header__nav {
        margin-left: auto;
      }
      .iris-header__brand-mark {
        display: grid;
        width: 1.55rem;
        height: 1.55rem;
        place-items: center;
        border-radius: 0.5rem;
        background: var(--iris-accent);
        color: #171717;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        font-weight: 800;
      }
      main {
        flex: 1;
      }
      .empty-state {
        display: grid;
        min-height: min(68vh, 650px);
        place-items: center;
        padding: 3rem 1rem;
        text-align: center;
      }
      .empty-state p {
        max-width: 25rem;
        margin: 0;
        color: color-mix(in srgb, var(--foreground) 48%, transparent);
        font-size: 0.875rem;
        line-height: 1.7;
      }
      .empty-state .eyebrow {
        margin-bottom: 0.75rem;
        color: color-mix(in srgb, var(--foreground) 38%, transparent);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .empty-state h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 580;
        letter-spacing: -0.055em;
      }
      .iris-footer {
        margin-top: auto;
      }
      .iris-footer__nav {
        gap: 0.15rem;
      }
      .iris-footer__link {
        min-width: auto;
        padding-inline: 0.7rem;
      }
      @media (max-width: 36rem) {
        .iris-header {
          border-radius: 1.25rem;
          align-items: flex-start;
        }
        .iris-header__actions {
          flex-wrap: wrap;
          justify-content: flex-end;
        }
        .iris-header__nav {
          order: 2;
          width: 100%;
          justify-content: flex-end;
        }
        .iris-header__link {
          min-height: 2.25rem;
        }
        .iris-footer {
          align-items: flex-start;
          flex-direction: column;
        }
        .iris-footer__nav {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="preview-page">
      <div class="iris-container">
        <header class="iris-header">
          <a class="iris-header__brand" href="#top" aria-label="Iris home"
            ><span class="iris-header__brand-mark">i</span><span>Iris</span></a
          >
          <div class="iris-header__actions">
            <nav class="iris-header__nav" aria-label="Site navigation">
              <a class="iris-header__link" href="#components">Components</a>
              <a class="iris-header__link" href="#tokens">Tokens</a>
              <a class="iris-header__link" href="#docs">Docs</a>
            </nav>
            <button
              class="iris-header__action"
              id="theme-toggle"
              type="button"
              aria-label="Switch to dark mode"
              title="Toggle theme"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" />
              </svg>
            </button>
            <a
              class="iris-header__action"
              href="https://github.com/weluvabid/iris"
              aria-label="Iris on GitHub"
              title="View source"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.2 3.34 1.56.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.12 2.96.71.78 1.14 1.78 1.14 3 0 4.3-2.61 5.25-5.1 5.52.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"
                />
              </svg>
            </a>
          </div>
        </header>
        <div class="iris-sticky-pill">
          <div class="iris-sticky-pill__content">
            <span class="iris-sticky-pill__dot"></span><span>MINIMAL OSS FOUNDATION</span>
          </div>
        </div>
      </div>
      <main id="top">
        <section class="empty-state">
          <div>
            <p class="eyebrow">The empty canvas</p>
            <h1>Room for the work.</h1>
            <p>
              This is the shell without project content: a quiet header, a compact status pill,
              generous space, and a restrained footer.
            </p>
          </div>
        </section>
      </main>
      <footer class="iris-container iris-footer">
        <a class="iris-footer__brand" href="#top"
          ><span class="iris-header__brand-mark">i</span><span>Iris</span></a
        >
        <span>Built for independent open-source projects.</span>
        <nav class="iris-footer__nav" aria-label="Project resources">
          <a class="iris-footer__link" href="https://github.com/weluvabid/iris">GitHub</a>
          <a class="iris-footer__link" href="#docs">Documentation</a>
          <a class="iris-footer__link" href="#issues">Issues</a>
        </nav>
      </footer>
    </div>
    <script>
      const root = document.documentElement;
      const button = document.querySelector('#theme-toggle');
      button.addEventListener('click', () => {
        const dark = root.classList.toggle('dark');
        button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        button.innerHTML = dark
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#fdfbf7';
      });
    </script>
  </body>
</html>
