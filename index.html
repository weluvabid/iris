<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090906" />
    <meta name="description" content="Preview the Iris site shell, cloned from Pulse." />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('iris-theme');
        } catch {
          // Storage can be unavailable; use the system preference.
        }
        const dark = preference
          ? preference === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        const root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#090906' : '#fafaf8');
      })();
    </script>
    <title>Iris — Site shell preview</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/playground/src/main.ts"></script>
  </body>
</html>
